name: Update visual baselines

# Manual only. The committed visual baselines were captured on Windows, and Linux
# renders fonts differently, so CI needs its own `*-chromium-linux.png` files.
# Run this on the runner that CI uses, download the artifact, review every PNG,
# then commit them under e2e/visual.spec.ts-snapshots/.
on:
  workflow_dispatch:

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Linux baselines
        run: npx playwright test e2e/visual.spec.ts --update-snapshots

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7
