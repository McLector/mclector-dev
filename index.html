<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Myre Lector — 4th-year CS student, React Native & TypeScript developer, open for internship. Interactive 3D portfolio."
    />
    <meta name="theme-color" content="#05060d" />
    <title>McLector Dev</title>
    <!--
      Anti-flash theme boot: resolve dark/light BEFORE first paint so the
      galaxy never flashes the wrong sky. Mirrors src/lib/theme.ts exactly:
      a stored choice wins, otherwise DARK — the visitor's OS scheme is not an input.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var storedTheme = null;
        var storedMotion = null;
        try {
          storedTheme = localStorage.getItem("mclector-theme");
          storedMotion = localStorage.getItem("mclector-motion");
        } catch (e) {
          // Blocked storage (private window): fall through to the defaults below.
        }

        var theme = storedTheme === "dark" || storedTheme === "light" ? storedTheme : "dark";
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;

        // Animations: on for everyone unless the visitor switched them off. Mirrors src/lib/motion.ts
        // (resolveInitialMotion). The OS reduced-motion setting is deliberately NOT an input.
        root.setAttribute("data-motion", storedMotion === "off" ? "off" : "on");

        // Input mode: a first-paint HINT only (any input can hover -> mouse, else touch). Mirrors
        // src/lib/inputMode.ts (initialInputMode); real pointer events take over from there, so a browser that
        // misreports its pointer still gets working hover once a mouse moves.
        var anyHover = false;
        try {
          anyHover = window.matchMedia("(any-hover: hover)").matches;
        } catch (e) {
          // No matchMedia: stay on the safe touch default.
        }
        root.setAttribute("data-input", anyHover ? "mouse" : "touch");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
